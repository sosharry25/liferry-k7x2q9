  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:Arial,"Microsoft JhengHei","微軟正黑體",sans-serif;
    overflow-x:hidden;
  }
  .screen{
    display:none;min-height:100vh;padding:32px 16px;
    flex-direction:column;align-items:center;justify-content:center;text-align:center;
    animation:fade .8s ease;
  }
  .screen.active{display:flex}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .logo{width:min(380px,80vw);height:auto;display:block}
  .btn{
    font:inherit;font-size:1.15rem;letter-spacing:.5em;padding:.9em 2.2em .9em 2.7em;
    color:var(--ink);background:transparent;border:1.5px solid var(--ink);border-radius:999px;
    cursor:pointer;transition:all .3s;
  }
  .btn:hover{background:var(--ink);color:var(--bg)}
  .btn:disabled{opacity:.4;cursor:default;pointer-events:none}
  .btn.small{font-size:1rem;letter-spacing:.3em}
  .hint{color:var(--ink-soft);letter-spacing:.2em;font-size:.95rem;margin-top:18px}
  h2{font-weight:500;letter-spacing:.35em;font-size:1.4rem;margin-bottom:10px}

  /* 洗牌舞台 */
  .stage{position:relative;width:min(560px,94vw);height:min(420px,60vh);margin:10px 0}
  .stage .pc{position:absolute;left:50%;top:50%;margin:-27px 0 0 -27px;
    transition:transform .55s cubic-bezier(.5,0,.3,1)}

  /* 棋子 */
  .pc{width:54px;height:54px;perspective:400px}
  .pc .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s}
  .pc.flipped .in{transform:rotateY(180deg)}
  .face,.back{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;
    display:flex;align-items:center;justify-content:center}
  /* 木質棋子：多層陰影堆出厚度，漸層＋細紋做木頭質感 */
  .back,.face{
    --edge:#8a5a2b;
    box-shadow:
      inset 0 2px 3px rgba(255,240,205,.65),
      inset 0 -3px 5px rgba(90,50,15,.35),
      0 1px 0 #b98650, 0 2px 0 #a87843, 0 3px 0 #986a38, 0 4px 0 #8a5d2e, 0 5px 0 #7c5127,
      0 9px 10px rgba(40,20,5,.38);
  }
  .face{
    transform:rotateY(180deg);
    background:
      repeating-linear-gradient(97deg,rgba(150,100,40,.10) 0 2px,transparent 2px 7px),
      radial-gradient(circle at 34% 28%,#f6dca9 0%,#e5bf84 45%,#cf9f5f 100%);
    font-family:"PieceKai","LXGW WenKai TC","DFKai-SB","標楷體",KaiTi,serif;font-size:34px;font-weight:700;
  }
  .face::before{ /* 刻出的內圈 */
    content:"";position:absolute;inset:5px;border-radius:50%;
    border:1.5px solid currentColor;opacity:.75;
    box-shadow:0 1px 0 rgba(255,235,195,.7), inset 0 1px 0 rgba(255,235,195,.5);
  }
  .face.r{color:#a3281c} .face.b{color:#2e2a26}
  .face{text-shadow:0 1px 0 rgba(255,238,200,.85), 0 -1px 0 rgba(60,30,5,.25)} /* 陰刻感 */
  .back{
    background:
      repeating-linear-gradient(97deg,rgba(60,30,5,.12) 0 2px,transparent 2px 7px),
      radial-gradient(circle at 34% 28%,#b98550 0%,#9a6a3a 50%,#7d5128 100%);
  }
  .back::before{ /* 與正面相同的刻圈 */
    content:"";position:absolute;inset:5px;border-radius:50%;
    border:1.5px solid rgba(50,25,5,.6);
    box-shadow:0 1px 0 rgba(255,225,180,.45), inset 0 1px 0 rgba(255,225,180,.3);
  }
  .back::after{

  }

  /* 輸入 */
  textarea{
    width:min(520px,92vw);height:140px;resize:none;font:inherit;font-size:1.1rem;line-height:1.8;
    color:var(--ink);background:#fffdfa;border:1.5px solid var(--line);border-radius:12px;padding:16px;outline:none;
  }
  textarea:focus{border-color:var(--ink)}
  .row{display:flex;gap:14px;margin-top:26px;flex-wrap:wrap;justify-content:center}

  /* 抽棋數量 */
  .choices{display:flex;gap:20px;margin-top:28px;flex-wrap:wrap;justify-content:center}
  .choice{
    width:150px;padding:28px 10px;border:1.5px solid var(--ink);border-radius:16px;cursor:pointer;
    background:transparent;font:inherit;color:var(--ink);transition:all .3s;
  }
  .choice:hover{background:var(--ink);color:var(--bg)}
  .choice b{display:block;font-size:2.6rem;font-weight:500;line-height:1.2}
  .choice span{letter-spacing:.3em;font-size:.95rem}
  .qbox{max-width:520px;color:var(--ink-soft);margin-bottom:6px;line-height:1.8;font-size:1rem}
  .qbox em{font-style:normal;color:var(--ink)}

  /* 結果 */
  .result{position:relative;container-type:inline-size;width:min(400px,90vw);margin:26px auto 6px}
  .result.n5{width:min(250px,60vw)}
  .slot{position:absolute}
  .slot .pc{width:100%;height:auto;aspect-ratio:1}
  .slot .face{font-size:var(--fs)}
  .deck{position:relative;width:90px;height:90px;margin:10px 0}
  .deck .pc{position:absolute;left:18px;top:18px}
  .qshow{max-width:520px;line-height:1.8;margin-top:4px}
  .qshow span{color:var(--ink-soft)}

  /* 自選抽棋 */
  .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;width:min(560px,94vw);margin:22px 0 10px;justify-items:center}
  .grid .pc{width:min(54px,10.5vw);height:min(54px,10.5vw);cursor:pointer;transition:transform .25s,opacity .3s}
  .grid .pc:hover{transform:translateY(-4px)}
  .grid .pc.sel{opacity:.25;pointer-events:none;transform:scale(.85)}
  .grid .pc .num{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--ink);font-weight:700;font-size:1.2rem;z-index:2}
  .grid .pc.sel .num{display:flex}
  .grid.shuffling .pc{transition:transform .6s cubic-bezier(.5,0,.3,1);pointer-events:none}
  @media (max-width:480px){
    .grid{grid-template-columns:repeat(6,1fr);gap:10px 2vw}
    .grid .pc{width:14vw;height:14vw}
  }
  .counter{color:var(--ink);letter-spacing:.2em;font-size:1.05rem;min-height:1.6em}
</style>

const RED  = "帥仕仕相相俥俥傌傌炮炮兵兵兵兵兵".split("");
const BLK  = "將士士象象車車馬馬砲砲卒卒卒卒卒".split("");
const ALL  = [...RED.map(c=>({c,t:"r"})), ...BLK.map(c=>({c,t:"b"}))]; // 共 32 支
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r=>setTimeout(r,ms));

function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  $(id).classList.add("active");
}
function rnd(n){ // 密碼學等級亂數 0..n-1
  const a=new Uint32Array(1), lim=Math.floor(4294967296/n)*n;
  do{ crypto.getRandomValues(a) }while(a[0]>=lim);
  return a[0]%n;
}
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
function makePiece(p, flipped=false){
  const d=document.createElement("div");
  d.className="pc"+(flipped?" flipped":"");
  d.innerHTML=`<div class="in"><div class="back"></div><div class="face ${p.t}">${p.c}</div></div>`;
  return d;
}

let question="";

/* 洗牌動畫 */
async function runShuffle(){
  show("s-shuffle");
  const stage=$("stage"); stage.innerHTML="";
  const pcs=ALL.map(()=>{const e=makePiece({c:"",t:"b"});stage.appendChild(e);return e});
  const W=stage.clientWidth, H=stage.clientHeight;
  const place=(e,x,y,r)=>e.style.transform=`translate(${x}px,${y}px) rotate(${r}deg)`;
  // 先疊成一堆
  pcs.forEach(e=>place(e,0,0,0));
  await sleep(500);
  // 散開再收攏，重複數次
  for(let round=0;round<5;round++){
    pcs.forEach(e=>place(e,(Math.random()-.5)*(W-70),(Math.random()-.5)*(H-70),Math.random()*360));
    await sleep(650);
    if(round%2==1){
      pcs.forEach(e=>place(e,(Math.random()-.5)*30,(Math.random()-.5)*30,Math.random()*40-20));
      await sleep(600);
    }
  }
  pcs.forEach(e=>place(e,0,0,0));
  await sleep(800);
  show("s-question");
  $("q").focus();
}

/* 音效（WebAudio 合成，免外部檔案） */
let ac=null;
function sfx(kind){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended") ac.resume();
    const t=ac.currentTime;
    const o=ac.createOscillator(), g=ac.createGain();
    o.type="triangle";
    const f0=kind==="flip"?520:380;
    o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(f0*0.45,t+0.09);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(kind==="flip"?0.35:0.22,t+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+0.16);
    // 木頭敲擊的短噪音
    const len=Math.floor(ac.sampleRate*0.04), buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const n=ac.createBufferSource(), ng=ac.createGain(), bp=ac.createBiquadFilter();
    bp.type="bandpass"; bp.frequency.value=1800; ng.gain.value=0.25;
    n.buffer=buf; n.connect(bp).connect(ng).connect(ac.destination); n.start(t);
  }catch(e){}
}

/* 自選抽棋 */
function pick(n){
  show("s-pick");
  $("qecho2").textContent=question;
  const grid=$("grid"); grid.innerHTML="";
  const deck=shuffle(ALL), chosen=[];
  const upd=()=>$("counter").textContent=`已抽 ${chosen.length} / ${n} 支`;
  $("counter").textContent="洗棋中……";
  deck.forEach(p=>{
    const e=makePiece(p);
    e.insertAdjacentHTML("beforeend",'<div class="num"></div>');
    e.onclick=async()=>{
      if(chosen.length>=n) return;
      chosen.push(p); sfx("tap");
      e.classList.add("sel"); e.querySelector(".num").textContent=chosen.length;
      upd();
      if(chosen.length===n){ await sleep(700); reveal(chosen); }
    };
    grid.appendChild(e);
  });
  shuffleGrid(grid).then(upd);
}

/* 選棋前的洗棋動畫：先疊成一堆、散開攪動，再一支支攤回原位 */
async function shuffleGrid(grid){
  const pcs=[...grid.children];
  grid.classList.add("shuffling");
  await sleep(850); // 等畫面淡入完成後再量位置
  const g=grid.getBoundingClientRect(), cx=g.left+g.width/2, cy=g.top+g.height/2;
  const home=pcs.map(e=>{const r=e.getBoundingClientRect();return [cx-(r.left+r.width/2), cy-(r.top+r.height/2)]});
  const put=(e,x,y,r)=>e.style.transform=`translate(${x}px,${y}px) rotate(${r}deg)`;
  pcs.forEach((e,i)=>put(e,home[i][0],home[i][1],0));
  await sleep(700);
  for(let k=0;k<4;k++){
    sfx("tap");
    pcs.forEach((e,i)=>put(e,home[i][0]+(Math.random()-.5)*g.width*.8,home[i][1]+(Math.random()-.5)*g.height*.8,Math.random()*360));
    await sleep(600);
    pcs.forEach((e,i)=>put(e,home[i][0]+(Math.random()-.5)*40,home[i][1]+(Math.random()-.5)*40,Math.random()*60-30));
    await sleep(500);
  }
  for(const e of pcs){e.style.transform="";}
  await sleep(750);
  grid.classList.remove("shuffling");
}

/* 排法（單位：像素，棋子直徑 62，依序為第 1、2、3… 支的左上角位置） */
const U=76; // 相鄰兩支棋的間距（所有棋都落在同一個等距格點上）
const LAYOUTS={
  5:[[1,1],[2,0],[0,0],[0,2],[2,2]].map(([x,y])=>[x*U,y*U]),
  9:[[4,1],[3,0],[3,1],[3,2],[1,1],[2,0],[0,0],[0,2],[2,2]].map(([x,y])=>[x*U,y*U])
};
const D=62;

/* 依序翻開 */
async function reveal(picked){
  const n=picked.length, pos=LAYOUTS[n];
  show("s-result");
  $("qres").textContent=question;
  $("rtitle").textContent="翻棋中……";
  $("btn-again").style.visibility="hidden";
  const box=$("result"); box.innerHTML=""; box.className="result n"+n;
  const W=Math.max(...pos.map(p=>p[0]))+D, H=Math.max(...pos.map(p=>p[1]))+D;
  box.style.aspectRatio=W+"/"+H;
  const slots=picked.map((p,i)=>{
    const s=document.createElement("div"); s.className="slot";
    s.style.cssText=`left:${pos[i][0]/W*100}%;top:${pos[i][1]/H*100}%;width:${D/W*100}%;--fs:${D/W*62}cqw`;
    const pc=makePiece(p); pc.style.opacity="0"; pc.style.transition="opacity .5s";
    s.append(pc); box.appendChild(s); return {s,pc};
  });
  await sleep(300);
  for(let i=0;i<n;i++){
    slots[i].pc.style.opacity="1";
    await sleep(500);
    slots[i].pc.classList.add("flipped"); sfx("flip");
    await sleep(900);
  }
  $("rtitle").textContent="你抽到的棋";
  $("btn-again").style.visibility="visible";
}

$("btn-start").onclick=()=>{sfx("tap");runShuffle();};
$("q").oninput=e=>$("btn-q").disabled=!e.target.value.trim();
$("btn-q").onclick=()=>{
  question=$("q").value.trim();
  $("qecho").textContent=question;
  show("s-count");
};
document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>pick(+b.dataset.n));
$("btn-again").onclick=()=>{ $("q").value=""; $("btn-q").disabled=true; show("s-home"); };
</script>
</body>
</html>
